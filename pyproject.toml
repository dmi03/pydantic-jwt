[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-jwt"
version = "0.1.1"
description = "Structural JWT validation as a Pydantic type"
readme = "README.md"
license = "MIT"
authors = [{ name = "dmi03", email = "hello@dmi03.com" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/dmi03/pydantic-jwt"
Repository = "https://github.com/dmi03/pydantic-jwt"
Issues = "https://github.com/dmi03/pydantic-jwt/issues"

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "tests"}
]
lint = [
    "ruff>=0.16.3",
    "mypy>=2.3.0",
]
tests = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pydantic_jwt"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
exclude = "^tests/"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pydantic_jwt"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.",
]
